[package]
name = "pdfi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdfi-content = { path = "../crates/pdfi-content" }
pdfi-syntax = { path = "../crates/pdfi-syntax" }

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false

[[bin]]
name = "parse_object"
path = "fuzz_targets/parse_object.rs"
test = false
doc = false

[workspace]
