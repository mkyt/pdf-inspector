[package]
name = "pdfi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.4.3"
pdfi-api = { version = "0.1.0", path = "../pdfi-api" }
pdfi-syntax = { version = "0.1.0", path = "../pdfi-syntax" }
rayon = "1.12.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29.0"
