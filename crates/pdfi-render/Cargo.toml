[package]
name = "pdfi-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# PNG output (CLI).
png = ["tiny-skia/png-format"]

[dependencies]
moxcms = "0.8.1"
pdfi-content = { version = "0.1.0", path = "../pdfi-content" }
pdfi-model = { version = "0.1.0", path = "../pdfi-model" }
pdfi-syntax = { version = "0.1.0", path = "../pdfi-syntax" }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }

[lints]
workspace = true
