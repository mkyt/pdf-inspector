[package]
name = "pdfi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pdfi-schema = { version = "0.1.0", path = "../pdfi-schema" }
pdfi-server = { version = "0.1.0", path = "../pdfi-server" }
pdfi-syntax = { version = "0.1.0", path = "../pdfi-syntax" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal"] }

[lints]
workspace = true

[[bin]]
name = "pdfi"
path = "src/main.rs"
